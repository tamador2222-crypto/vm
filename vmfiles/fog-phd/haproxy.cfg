global
    stats socket /var/run/haproxy.sock mode 660 level admin
    stats timeout 30s

defaults
    mode http
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms

frontend fog_frontend
    bind *:80
    default_backend fog_nodes

listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 2s
    stats admin if TRUE

backend fog_nodes
    balance roundrobin
    option httpchk GET /health
    server fog1 fog-node-1:80 check inter 2000 rise 2 fall 3
    server fog2 fog-node-2:80 check inter 2000 rise 2 fall 3
    server fog3 fog-node-3:80 check inter 2000 rise 2 fall 3
